name: Build and Deploy Ktor App to EC2

on:
  push:
    branches:
      - dev-erick

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v3

      - name: ⚙️ Validar variables obligatorias
        run: |
          if [ -z "${{ secrets.EC2_HOST_FRONT }}" ] || [ -z "${{ secrets.EC2_USER_FRONT }}" ] || [ -z "${{ secrets.EC2_SSH_KEY_FRONT }}" ]; then
            echo "❌ Faltan variables obligatorias de conexión a EC2."
            exit 1
          fi

      - name: 🗂️ Crear archivo .env para el backend
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "DB_URL=${{ secrets.DB_URL }}" >> .env
          echo "DB_DRIVER=${{ secrets.DB_DRIVER }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

      - name: 📦 Comprimir proyecto
        run: |
          zip -r ktor-app.zip . -x "*.git*" "*.idea*" "*build/*" "*out/*" "*.gradle/*" "*.iml" "*.DS_Store"

      - name: 🚀 Instalar Docker y preparar entorno en EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_FRONT }}
          username: ${{ secrets.EC2_USER_FRONT }}
          key: ${{ secrets.EC2_SSH_KEY_FRONT }}
          port: 22
          script: |
            echo "🔧 Instalando Docker y unzip..."
            sudo apt-get update -y
            sudo apt-get install -y docker.io unzip
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker $USER || true
            
            echo "📁 Preparando carpeta del proyecto"
            rm -rf ~/ktor-app
            mkdir -p ~/ktor-app

      - name: 📤 Subir proyecto comprimido a EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST_FRONT }}
          username: ${{ secrets.EC2_USER_FRONT }}
          key: ${{ secrets.EC2_SSH_KEY_FRONT }}
          port: 22
          source: "ktor-app.zip"
          target: "/home/${{ secrets.EC2_USER_FRONT }}/ktor-app"

      - name: 🔧 Descomprimir, construir imagen y ejecutar contenedor en EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_FRONT }}
          username: ${{ secrets.EC2_USER_FRONT }}
          key: ${{ secrets.EC2_SSH_KEY_FRONT }}
          port: 22
          script: |
            echo "📂 Ingresando al directorio del proyecto"
            cd ~/ktor-app
            unzip -o ktor-app.zip
            
            echo "🧪 Verificando archivos Gradle..."
            if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
              echo "❌ No se encontró archivo Gradle. Abortando."
              exit 1
            fi

            echo "🧪 Validando Dockerfile..."
            if [ ! -f "Dockerfile" ]; then
              echo "❌ No se encontró el Dockerfile. Abortando."
              exit 1
            fi

            echo "🛠️ Creando archivo .env"
            cat > .env <<EOL
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DB_URL=${{ secrets.DB_URL }}
            DB_DRIVER=${{ secrets.DB_DRIVER }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOL

            echo "🧼 Limpiando contenedor e imagen anteriores..."
            docker stop ktor-app || true
            docker rm ktor-app || true
            docker rmi ktor-app || true

            echo "🔨 Construyendo imagen Docker..."
            docker build -t ktor-app .

            echo "🚀 Ejecutando contenedor"
            docker run -d --name ktor-app --env-file .env -p 8089:8089 ktor-app

            echo "✅ Despliegue exitoso"
