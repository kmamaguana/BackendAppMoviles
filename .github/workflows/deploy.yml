name: Deploy Ktor App to EC2

on:
  push:
    branches:
      - dev-erick

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout código fuente
        uses: actions/checkout@v4

      - name: 🐳 Construir imagen Docker
        run: docker build -t ktor-app .

      - name: 📦 Guardar imagen como archivo comprimido
        run: docker save ktor-app | gzip > ktor-app.tar.gz

      - name: 📡 Preparar entorno remoto
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_FRONT }}
          username: ${{ secrets.EC2_USER_FRONT }}
          key: ${{ secrets.EC2_SSH_KEY_FRONT }}
          script: |
            sudo apt update -y && sudo apt install -y docker.io
            sudo docker stop ktor-app || true
            sudo docker rm ktor-app || true
            rm -f ~/ktor-app.tar.gz .env

      - name: 📤 Subir imagen Docker
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST_FRONT }}
          username: ${{ secrets.EC2_USER_FRONT }}
          key: ${{ secrets.EC2_SSH_KEY_FRONT }}
          source: ktor-app.tar.gz
          target: ~/

      - name: 🚀 Ejecutar contenedor en EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_FRONT }}
          username: ${{ secrets.EC2_USER_FRONT }}
          key: ${{ secrets.EC2_SSH_KEY_FRONT }}
          script: |
            cd ~
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
            echo "DB_URL=${{ secrets.DB_URL }}" >> .env
            echo "DB_DRIVER=${{ secrets.DB_DRIVER }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

            sudo docker load < ktor-app.tar.gz
            sudo docker run -d --name ktor-app --env-file .env -p 8089:8089 ktor-app
